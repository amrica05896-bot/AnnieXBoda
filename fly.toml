# Project: AnnieX Media Enterprise
# Deployment: Fly.io Optimized for High-Performance Streaming

app = "anniexboda-mxodcg"
primary_region = "iad"

# ===============================
# Build Configuration
# ===============================
[build]
  dockerfile = "Dockerfile"

# ===============================
# Environment Variables
# ===============================
[env]
  # بايثون بدون تخزين مؤقت للوجات لسرعة الاستجابة
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  
  # الرام ديسك للملفات المؤقتة
  TMPDIR = "/dev/shm"

  # إجبار IPv4 لمنع مشاكل الـ 429 مع يوتيوب
  IP_VERSION = "4"

  # استغلال الـ 16 كور بالكامل
  OMP_NUM_THREADS = "16"
  MKL_NUM_THREADS = "16"
  NUMEXPR_NUM_THREADS = "16"

# ===============================
# Network Tuning (YouTube Booster) 🚀
# ===============================
[sysctl]
  # تفعيل خوارزمية BBR لتقليل الـ Latency في البث
  "net.core.default_qdisc" = "fq"
  "net.ipv4.tcp_congestion_control" = "bbr"

  # زيادة مساحة الـ Buffers لاستيعاب الـ 128 جيجا رام
  "net.core.rmem_max" = "16777216"
  "net.core.wmem_max" = "16777216"
  "net.ipv4.tcp_rmem" = "4096 87380 16777216"
  "net.ipv4.tcp_wmem" = "4096 65536 16777216"
  
  # تسريع بروتوكول TCP
  "net.ipv4.tcp_window_scaling" = "1"
  "net.ipv4.tcp_slow_start_after_idle" = "0"

# ===============================
# Machine Specs (The Ultimate Beast)
# ===============================
[[vm]]
  cpu_kind = "performance"
  cpus = 16
  memory_mb = 131072

# ===============================
# HTTP Service (Web Dashboard & API)
# ===============================
[[services]]
  internal_port = 8080
  protocol = "tcp"

  # توجيه ترافيك الـ HTTP العادي لـ HTTPS آمن
  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  # فتح بوابة الـ SSL الآمنة
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # نظام فحص الصحة (Health Check) لمراقبة استقرار البوت
  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/api/stats"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false
