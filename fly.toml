app = "anniexboda-mxodcg"
primary_region = "iad"

# ===============================
# Build
# ===============================
[build]
  dockerfile = "Dockerfile"

# ===============================
# Runtime (Worker Only)
# ===============================
# مفيش http_service
# مفيش ports
# شغال كـ background worker

# ===============================
# Environment
# ===============================
[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

  # Ollama
  OLLAMA_HOST = "127.0.0.1:11434"
  OLLAMA_KEEP_ALIVE = "1h"
  OLLAMA_MAX_QUEUE = "2"
  OLLAMA_NUM_THREADS = "16"
  OLLAMA_FLASH_ATTENTION = "1"
  OLLAMA_KV_CACHE_TYPE = "f16"

  # CPU / BLAS Acceleration
  OMP_NUM_THREADS = "16"
  MKL_NUM_THREADS = "16"
  NUMEXPR_NUM_THREADS = "16"

  # Models
  OLLAMA_LIGHT_MODEL = "llama3.1:8b"
  OLLAMA_HEAVY_MODEL = "llama3.1:70b"

# ===============================
# Machine Specs
# ===============================
[[vm]]
  cpu_kind = "performance"
  cpus = 16
  memory_mb = 131072
