<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="TitanOS Enterprise • The Ultimate Control Interface">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>TitanOS • Infinity Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. TITAN GRAPHICS ENGINE (VARIABLES & THEMES)
   ==========================================================================
*/
:root {
    /* --- ANIMATION & PHYSICS --- */
    --fps-target: 120ms;
    --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
    --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    
    /* --- DIMENSIONS --- */
    --sidebar-w: 280px;
    --header-h: 70px;
    --player-h: 90px;
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 12px;
}

/* --- THEME: LIQUID DARK (DEFAULT) --- */
[data-theme="dark"] {
    --bg-root: #000000;
    --bg-glass: rgba(10, 10, 12, 0.75);
    --bg-surface: rgba(20, 20, 25, 0.6);
    --bg-input: rgba(255, 255, 255, 0.05);
    
    --border-base: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(255, 255, 255, 0.15);
    
    --text-primary: #ffffff;
    --text-secondary: #8a8a95;
    
    --accent-main: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.4);
    
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 20px 50px rgba(0,0,0,0.8);
    
    --backdrop: blur(25px) saturate(100%);
}

/* --- THEME: iOS FROST (LIGHT) --- */
[data-theme="light"] {
    --bg-root: #f2f2f7;
    --bg-glass: rgba(255, 255, 255, 0.65); /* iOS Frosted Glass */
    --bg-surface: rgba(255, 255, 255, 0.75);
    --bg-input: rgba(0, 0, 0, 0.05);
    
    --border-base: rgba(0, 0, 0, 0.05);
    --border-glow: rgba(0, 0, 0, 0.1);
    
    --text-primary: #000000;
    --text-secondary: #666666;
    
    --accent-main: #007aff; /* iOS Blue */
    --accent-glow: rgba(0, 122, 255, 0.3);
    
    --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
    --shadow-lg: 0 25px 60px rgba(0,0,0,0.15);
    
    --backdrop: blur(30px) saturate(180%); /* The iOS Magic */
}

/* ==========================================================================
   2. GLOBAL RESET & TYPOGRAPHY
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
body {
    font-family: 'SF Pro Display', 'Inter', -apple-system, sans-serif;
    background: var(--bg-root); color: var(--text-primary);
    width: 100vw; height: 100vh; overflow: hidden;
    transition: background 0.5s var(--ease-smooth);
}

/* HIGH PERFORMANCE SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-main); }

/* FONTS */
.font-tech { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
.font-mono { font-family: 'JetBrains Mono', monospace; }

/* ==========================================================================
   3. PHYSICS CANVAS LAYER (BACKGROUND)
   ========================================================================== */
#liquid-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none; opacity: 0.6;
    transition: opacity 1s;
}
[data-theme="light"] #liquid-canvas { opacity: 1; mix-blend-mode: multiply; }

/* ==========================================================================
   4. APP SHELL (SIDEBAR & HEADER)
   ========================================================================== */
.app-shell {
    position: relative; z-index: 10; display: flex; width: 100%; height: 100%;
}

/* --- SIDEBAR --- */
.sidebar {
    width: var(--sidebar-w); background: var(--bg-glass); backdrop-filter: var(--backdrop);
    border-right: 1px solid var(--border-base); display: flex; flex-direction: column;
    padding: 30px; transition: transform 0.4s var(--ease-smooth); z-index: 100;
}

.brand { display: flex; align-items: center; gap: 15px; margin-bottom: 50px; cursor: pointer; }
.logo-box {
    width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--accent-main), #bc13fe);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 800;
    box-shadow: 0 8px 20px var(--accent-glow); position: relative; overflow: hidden;
}
.logo-box::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,0.4), transparent);
}
.brand-title h1 { font-size: 24px; font-weight: 700; line-height: 1; }
.brand-title span { font-size: 11px; color: var(--accent-main); font-weight: 600; letter-spacing: 2px; }

.nav { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.nav-btn {
    display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 16px;
    color: var(--text-secondary); font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s var(--ease-smooth); border: 1px solid transparent;
}
.nav-btn svg { width: 22px; height: 22px; fill: currentColor; transition: 0.3s; }
.nav-btn:hover { background: var(--bg-input); color: var(--text-primary); transform: translateX(5px); }
.nav-btn.active {
    background: var(--bg-surface); color: var(--accent-main);
    border-color: var(--border-base); box-shadow: var(--shadow-sm);
}

.sys-stats {
    background: var(--bg-input); border-radius: 16px; padding: 20px; border: 1px solid var(--border-base);
}
.stat-item { margin-bottom: 10px; }
.stat-head { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; color: var(--text-secondary); }
.stat-track { width: 100%; height: 6px; background: rgba(128,128,128,0.2); border-radius: 3px; overflow: hidden; }
.stat-bar { height: 100%; background: var(--accent-main); width: 0%; transition: width 0.5s; border-radius: 3px; }

/* --- MAIN CONTENT --- */
.viewport { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

.topbar {
    height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; background: var(--bg-glass); backdrop-filter: var(--backdrop);
    border-bottom: 1px solid var(--border-base); z-index: 90;
}

.page-info h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.page-info span { font-size: 12px; color: var(--accent-main); font-weight: 600; letter-spacing: 1px; }

.actions { display: flex; align-items: center; gap: 20px; }

.theme-switch {
    width: 44px; height: 44px; border-radius: 50%; background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid var(--border-base); color: var(--text-primary); transition: 0.3s;
}
.theme-switch:hover { transform: rotate(45deg); background: var(--bg-input); }

.connection {
    padding: 8px 16px; border-radius: 30px; background: rgba(0, 255, 157, 0.1);
    border: 1px solid rgba(0, 255, 157, 0.2); color: #00ff9d; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
}
.dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

/* ==========================================================================
   5. VIEW SYSTEM & COMPONENTS
   ========================================================================== */
.stage { flex: 1; padding: 40px; overflow-y: auto; position: relative; scroll-behavior: smooth; }

.view { display: none; animation: slideUp 0.6s var(--ease-smooth); }
.view.active { display: block; }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

/* --- CARDS (GLASSMORHPISM) --- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px; }

.card {
    background: var(--bg-surface); border: 1px solid var(--border-base); border-radius: var(--radius-xl);
    padding: 25px; position: relative; overflow: hidden; transition: 0.4s var(--ease-smooth);
    display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: var(--accent-main); }

.card-head { display: flex; justify-content: space-between; margin-bottom: 20px; }
.card-id { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-secondary); background: var(--bg-input); padding: 4px 8px; border-radius: 6px; }
.card-badge { font-size: 11px; font-weight: 800; background: #ff003c; color: #fff; padding: 4px 10px; border-radius: 20px; }

.media-row { display: flex; gap: 20px; margin-bottom: 25px; align-items: center; }
.poster { 
    width: 90px; height: 90px; border-radius: 16px; background-color: #111; background-size: cover; background-position: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border-base); flex-shrink: 0;
}
.details { overflow: hidden; }
.song-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 10px; align-items: center; }

.ctrl-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.c-btn {
    border: 1px solid var(--border-base); background: var(--bg-input); color: var(--text-primary);
    padding: 14px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: 700; font-size: 12px;
}
.c-btn:hover { background: var(--text-primary); color: var(--bg-root); }
.c-btn.stop:hover { background: #ff003c; color: #fff; border-color: #ff003c; }

.watch-btn {
    width: 100%; border: none; border-radius: 14px; padding: 16px;
    background: linear-gradient(90deg, var(--accent-main), #bc13fe);
    color: #fff; font-weight: 800; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; font-family: 'Rajdhani', sans-serif;
}
.watch-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--accent-glow); }

/* --- SEARCH & INPUTS --- */
.search-box { display: flex; gap: 15px; margin-bottom: 40px; }
.titan-input {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border-base);
    padding: 20px 25px; border-radius: 16px; color: var(--text-primary); font-size: 16px;
    font-family: 'Inter', sans-serif; transition: 0.3s; backdrop-filter: blur(10px);
}
.titan-input:focus { border-color: var(--accent-main); box-shadow: 0 0 0 4px var(--accent-glow); background: var(--bg-surface); }
.titan-btn {
    width: 140px; background: var(--text-primary); color: var(--bg-root); border: none; border-radius: 16px;
    font-weight: 800; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 16px; letter-spacing: 1px;
}

/* --- HACKER TERMINAL --- */
.terminal {
    background: #0d0d0f; border: 1px solid var(--border-base); border-radius: var(--radius-xl);
    padding: 30px; font-family: 'JetBrains Mono', monospace; height: 600px; display: flex; flex-direction: column;
}
.term-out { flex: 1; overflow-y: auto; color: #a0a0a0; font-size: 13px; margin-bottom: 20px; }
.line { margin-bottom: 6px; border-bottom: 1px solid #1a1a1c; padding-bottom: 4px; }
.ts { color: #555; margin-right: 12px; }
.suc { color: #00ff9d; } .err { color: #ff003c; }
.term-in-box { display: flex; align-items: center; gap: 10px; color: var(--accent-main); }
.term-in { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 14px; }

/* ==========================================================================
   6. CUSTOM CINEMA PLAYER (THE NETFLIX KILLER)
   ========================================================================== */
.cinema-overlay {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: none; flex-direction: column; opacity: 0; transition: opacity 0.6s var(--ease-smooth);
}
.cinema-overlay.active { display: flex; opacity: 1; }

/* Top Control Bar */
.cinema-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 80px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
    z-index: 20; transition: transform 0.3s;
}
.cinema-brand { font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 4px; color: rgba(255,255,255,0.7); }
.close-cinema {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 10px 20px; border-radius: 30px; cursor: pointer;
    font-weight: 600; font-size: 12px; backdrop-filter: blur(10px); transition: 0.3s;
    display: flex; align-items: center; gap: 10px;
}
.close-cinema:hover { background: #ff003c; border-color: #ff003c; box-shadow: 0 0 30px rgba(255, 0, 60, 0.5); }

/* Main Video Stage */
.cinema-stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
}

/* The Iframe (Hidden UI) */
.video-layer {
    width: 100%; height: 100%; pointer-events: none; /* User clicks pass through to our controls */
    border: none; position: absolute; z-index: 1; transform: scale(1.01); /* Remove edges */
}

/* Interaction Layer (For Play/Pause Click) */
.interact-layer {
    position: absolute; inset: 0; z-index: 5; cursor: none;
}
.interact-layer:hover { cursor: default; }

/* Bottom Controls (Netflix Style) */
.cinema-controls {
    position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    z-index: 20; opacity: 0; transition: opacity 0.3s;
    display: flex; flex-direction: column; gap: 15px;
}
.cinema-stage:hover .cinema-controls, .cinema-stage:hover .cinema-top { opacity: 1; }

.progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: var(--accent-main); width: 0%; border-radius: 3px; position: relative; box-shadow: 0 0 15px var(--accent-main); }
.progress-thumb { 
    width: 16px; height: 16px; background: #fff; border-radius: 50%; 
    position: absolute; right: -8px; top: -5px; transform: scale(0); transition: 0.2s; 
}
.progress-container:hover .progress-thumb { transform: scale(1); }

.ctrl-row { display: flex; justify-content: space-between; align-items: center; color: #fff; }
.left-ctrls { display: flex; gap: 20px; align-items: center; }
.right-ctrls { display: flex; gap: 20px; align-items: center; }

.c-icon { cursor: pointer; transition: 0.2s; opacity: 0.8; }
.c-icon:hover { opacity: 1; transform: scale(1.2); color: var(--accent-main); }
.c-icon svg { width: 28px; height: 28px; fill: currentColor; }

.qual-badge { 
    font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.2); 
    padding: 4px 8px; border-radius: 4px; cursor: pointer; 
}

/* Buffering Spinner */
.buffer-loader {
    position: absolute; width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid var(--accent-main); border-radius: 50%; z-index: 15;
    animation: spin 1s linear infinite; display: none;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ==========================================================================
   7. MOBILE RESPONSIVE
   ========================================================================== */
@media (max-width: 1024px) {
    .sidebar { position: fixed; transform: translateX(-100%); }
    .topbar { padding: 0 20px; }
    .stage { padding: 20px; padding-bottom: 120px; }
    
    /* Mobile Bottom Dock */
    .mobile-dock {
        display: flex; position: fixed; bottom: 20px; left: 20px; right: 20px;
        height: 70px; background: rgba(20,20,20,0.9); backdrop-filter: blur(25px);
        border: 1px solid var(--border-glow); border-radius: 35px;
        justify-content: space-around; align-items: center; z-index: 900;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .dock-btn { color: var(--text-secondary); padding: 12px; border-radius: 50%; transition: 0.3s; }
    .dock-btn.active { color: #fff; background: var(--accent-main); box-shadow: 0 0 20px var(--accent-glow); }
    .dock-btn svg { width: 24px; height: 24px; fill: currentColor; }
}
@media (min-width: 1025px) { .mobile-dock { display: none; } }

</style>
</head>
<body>

<canvas id="liquid-canvas"></canvas>
<div class="scanlines"></div>

<div class="app-shell">
    
    <aside class="sidebar">
        <div class="brand">
            <div class="logo-box">T</div>
            <div class="brand-title">
                <h1>TitanOS</h1>
                <span>INFINITY</span>
            </div>
        </div>

        <nav class="nav">
            <div class="nav-btn active" onclick="App.nav('dashboard', this)">
                <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                <span data-lang="nav_dash">Control Center</span>
            </div>
            <div class="nav-btn" onclick="App.nav('media', this)">
                <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
                <span data-lang="nav_media">Media Browser</span>
            </div>
            <div class="nav-btn" onclick="App.nav('remote', this)">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H9v-2h6v2zm-3-5V7l6 3-6 3z"/></svg>
                <span data-lang="nav_remote">Remote Access</span>
            </div>
            <div class="nav-btn" onclick="App.nav('queue', this)">
                <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4z"/></svg>
                <span data-lang="nav_queue">Queue List</span>
            </div>
        </nav>

        <div class="sys-stats">
            <div class="stat-item">
                <div class="stat-head"><span>CPU LOAD</span><span id="cpu-val">0%</span></div>
                <div class="stat-track"><div class="stat-bar" id="cpu-bar"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-head"><span>RAM USAGE</span><span id="ram-val">0GB</span></div>
                <div class="stat-track"><div class="stat-bar" id="ram-bar" style="background:var(--accent-purple)"></div></div>
            </div>
        </div>
    </aside>

    <main class="viewport">
        <header class="topbar">
            <div class="page-info">
                <h2 id="view-head" class="font-tech">DASHBOARD</h2>
                <span>ENTERPRISE v12.0</span>
            </div>

            <div class="actions">
                <div class="connection" id="conn-pill">
                    <div class="dot"></div> ONLINE
                </div>
                <div class="theme-switch" onclick="App.toggleTheme()">
                    <svg id="theme-icon" viewBox="0 0 24 24" width="20" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
                </div>
            </div>
        </header>

        <div class="stage">
            
            <section id="view-dashboard" class="view active">
                <div class="grid" id="stream-grid">
                    </div>
            </section>

            <section id="view-media" class="view">
                <div class="search-box">
                    <input type="text" class="titan-input" id="search-q" placeholder="Global Media Search..." onkeypress="if(event.key==='Enter') Media.search()">
                    <button class="titan-btn" onclick="Media.search()">SCAN</button>
                </div>
                <div class="grid" id="media-results"></div>
            </section>

            <section id="view-remote" class="view">
                <div class="terminal">
                    <div class="term-out" id="term-out">
                        <div class="line"><span class="ts">[SYS]</span> TitanOS Remote Injector Ready.</div>
                    </div>
                    
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                        <input type="text" class="titan-input" id="rem-target" placeholder="Chat ID (-100...)">
                        <input type="text" class="titan-input" id="rem-query" placeholder="Link / Query">
                    </div>
                    
                    <div style="display:flex; gap:15px; margin-bottom:20px;">
                        <button class="titan-btn" onclick="Remote.send(false)" style="background:var(--accent-main); color:#000">AUDIO</button>
                        <button class="titan-btn" onclick="Remote.send(true)" style="background:transparent; border:1px solid #fff; color:#fff">VIDEO</button>
                    </div>
                </div>
            </section>

            <section id="view-queue" class="view">
                <div class="search-box">
                    <input type="text" class="titan-input" id="queue-id" placeholder="Enter Chat ID to view queue...">
                    <button class="titan-btn" onclick="Queue.fetch()">LOAD</button>
                </div>
                <div class="terminal" id="queue-list" style="height:400px; color:#fff">
                    </div>
            </section>

        </div>
    </main>
</div>

<div class="cinema-overlay" id="cinema">
    <div class="cinema-top">
        <div class="close-cinema" onclick="Player.close()">
            <svg viewBox="0 0 24 24" width="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            EXIT THEATER
        </div>
        <div class="cinema-brand">TITAN 4K</div>
        <div class="qual-badge">1080p</div>
    </div>

    <div class="cinema-stage">
        <div class="buffer-loader" id="buffer"></div>
        <div class="interact-layer" onclick="Player.togglePlay()"></div>
        
        <iframe id="video-frame" class="video-layer" 
            allow="autoplay; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>

        <div class="cinema-controls">
            <div class="progress-container">
                <div class="progress-fill" style="width: 45%;"></div>
                <div class="progress-thumb"></div>
            </div>
            
            <div class="ctrl-row">
                <div class="left-ctrls">
                    <div class="c-icon" onclick="Player.togglePlay()">
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </div>
                    <div class="c-icon" onclick="Player.rewind()">
                        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                    </div>
                    <div class="c-icon" onclick="Player.forward()">
                        <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                    </div>
                    <div style="font-family:'Rajdhani'; font-weight:700; letter-spacing:1px">LIVE FEED</div>
                </div>
                
                <div class="right-ctrls">
                    <div class="c-icon"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></div>
                    <div class="c-icon" onclick="Player.fullscreen()">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mobile-dock">
    <div class="dock-btn active" onclick="App.nav('dashboard', this)"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
    <div class="dock-btn" onclick="App.nav('media', this)"><svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg></div>
    <div class="dock-btn" onclick="App.nav('remote', this)"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H9v-2h6v2zm-3-5V7l6 3-6 3z"/></svg></div>
</div>

<script>
/**
 * TITAN OS INFINITY KERNEL
 * 120 FPS Optimized Logic
 */

// --- CORE SYSTEM ---
const App = {
    theme: 'dark',
    api: {
        status: '/status_json',
        stats: '/api/stats',
        control: '/api/control',
        play: '/api/play',
        search: '/api/search',
        queue: '/api/queue'
    },

    init: () => {
        Physics.init(); // Start background engine
        setInterval(App.poll, 2500); // Heartbeat
        App.poll();
    },

    nav: (viewId, btn) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-'+viewId).classList.add('active');
        
        // Update nav state
        document.querySelectorAll('.nav-btn, .dock-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        
        const titles = { 'dashboard':'DASHBOARD', 'media':'MEDIA BROWSER', 'remote':'REMOTE INJECTOR', 'queue':'QUEUE LIST' };
        document.getElementById('view-head').innerText = titles[viewId];
    },

    toggleTheme: () => {
        App.theme = App.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', App.theme);
    },

    poll: async () => {
        try {
            // Fetch Status
            const sRes = await fetch(App.api.status);
            const status = await sRes.json();
            Dashboard.render(status);

            // Fetch Stats
            const hRes = await fetch(App.api.stats);
            const stats = await hRes.json();
            document.getElementById('cpu-bar').style.width = stats.cpu + '%';
            document.getElementById('cpu-val').innerText = stats.cpu + '%';
            document.getElementById('ram-bar').style.width = stats.ram_percent + '%';
            document.getElementById('ram-val').innerText = stats.ram_used_gb + 'GB';

            document.getElementById('conn-pill').style.color = '#00ff9d';
            document.getElementById('conn-pill').style.borderColor = 'rgba(0,255,157,0.2)';
        } catch(e) {
            document.getElementById('conn-pill').style.color = '#ff003c';
            document.getElementById('conn-pill').style.borderColor = '#ff003c';
        }
    }
};

// --- PHYSICS ENGINE (BACKGROUND) ---
const Physics = {
    canvas: document.getElementById('liquid-canvas'),
    ctx: null,
    orbs: [],
    init: () => {
        Physics.ctx = Physics.canvas.getContext('2d');
        Physics.resize();
        window.addEventListener('resize', Physics.resize);
        
        // Generate Orbs
        for(let i=0; i<5; i++) {
            Physics.orbs.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random()-0.5) * 2,
                vy: (Math.random()-0.5) * 2,
                r: Math.random() * 200 + 100,
                color: `hsla(${Math.random()*360}, 70%, 50%, 0.15)`
            });
        }
        requestAnimationFrame(Physics.loop);
    },
    resize: () => {
        Physics.canvas.width = window.innerWidth;
        Physics.canvas.height = window.innerHeight;
    },
    loop: () => {
        const ctx = Physics.ctx;
        const w = Physics.canvas.width;
        const h = Physics.canvas.height;
        ctx.clearRect(0,0,w,h);
        
        Physics.orbs.forEach(o => {
            o.x += o.vx; o.y += o.vy;
            if(o.x < -o.r || o.x > w+o.r) o.vx *= -1;
            if(o.y < -o.r || o.y > h+o.r) o.vy *= -1;
            
            ctx.beginPath();
            const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
            g.addColorStop(0, o.color);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
            ctx.fill();
        });
        requestAnimationFrame(Physics.loop);
    }
};

// --- DASHBOARD ---
const Dashboard = {
    render: (data) => {
        const grid = document.getElementById('stream-grid');
        if(data.count === 0) {
            if(!grid.innerHTML.includes('IDLE')) grid.innerHTML = `
            <div style="grid-column:1/-1; height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-secondary); border:1px dashed var(--border-base); border-radius:24px">
                <h2 class="font-tech" style="font-size:32px; color:var(--text-primary)">SYSTEM IDLE</h2>
                <p>No active streams detected.</p>
            </div>`;
            return;
        }

        let html = '';
        data.chats.forEach(chat => {
            const thumb = chat.vidid ? `https://img.youtube.com/vi/${chat.vidid}/mqdefault.jpg` : '';
            html += `
            <div class="card">
                <div class="card-head">
                    <span class="card-id">${chat.chat_id}</span>
                    <span class="card-badge">LIVE</span>
                </div>
                <div class="media-row">
                    <div class="poster" style="background-image:url('${thumb}')"></div>
                    <div class="details">
                        <div class="song-title">${chat.title}</div>
                        <div class="song-meta">
                            <span>${chat.duration}</span> • 
                            <span style="color:var(--accent-main)">${chat.stream_type}</span>
                        </div>
                    </div>
                </div>
                <div class="ctrl-bar">
                    <button class="c-btn" onclick="Control.act(${chat.chat_id},'pause')">||</button>
                    <button class="c-btn" onclick="Control.act(${chat.chat_id},'resume')">▶</button>
                    <button class="c-btn stop" onclick="Control.act(${chat.chat_id},'stop')">■</button>
                </div>
                <button class="watch-btn" onclick="Player.open('${chat.vidid}')">
                    ENTER CINEMA
                </button>
            </div>`;
        });
        
        // DOM Diffing lite
        if(grid.innerHTML.length !== html.length) grid.innerHTML = html;
    }
};

// --- CUSTOM PLAYER (THE NETFLIX KILLER) ---
const Player = {
    frame: document.getElementById('video-frame'),
    overlay: document.getElementById('cinema'),
    isPlaying: true,
    
    open: (vid) => {
        if(!vid) return alert("No Video Source");
        // Use No-Cookie + Controls=0 + ModestBranding to hide YT UI
        Player.frame.src = `https://www.youtube.com/embed/${vid}?autoplay=1&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&disablekb=1&fs=0`;
        Player.overlay.classList.add('active');
        document.getElementById('buffer').style.display = 'block';
        setTimeout(() => document.getElementById('buffer').style.display = 'none', 1500);
    },
    
    close: () => {
        Player.frame.src = "";
        Player.overlay.classList.remove('active');
    },
    
    togglePlay: () => {
        // Since we can't postMessage easily without complex setup, 
        // we toggle visual state. In a real 100% app we use postMessage API.
        Player.isPlaying = !Player.isPlaying;
        const icon = document.getElementById('play-icon');
        if(Player.isPlaying) {
            icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
            Player.postCmd('playVideo');
        } else {
            icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
            Player.postCmd('pauseVideo');
        }
    },
    
    postCmd: (cmd) => {
        Player.frame.contentWindow.postMessage(JSON.stringify({
            'event': 'command', 'func': cmd, 'args': []
        }), '*');
    },
    
    fullscreen: () => {
        if (!document.fullscreenElement) {
            Player.overlay.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
};

// --- MEDIA BROWSER ---
const Media = {
    search: async () => {
        const q = document.getElementById('search-q').value;
        const grid = document.getElementById('media-results');
        grid.innerHTML = '<div style="color:var(--text-secondary); padding:20px; grid-column:1/-1; text-align:center">Scanning Neural Database...</div>';
        
        try {
            const res = await fetch(App.api.search, { method:'POST', body:JSON.stringify({query:q}) });
            const data = await res.json();
            
            let html = '';
            data.results.forEach(item => {
                html += `
                <div class="card" style="padding:15px">
                    <div class="media-row">
                        <div class="poster" style="width:120px; background-image:url('${item.thumb}')"></div>
                        <div class="details">
                            <div class="song-title" style="font-size:14px">${item.title}</div>
                            <div class="song-meta">${item.duration}</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:10px">
                        <button class="c-btn" style="flex:1" onclick="Media.fill('${item.title}')">USE</button>
                        <button class="c-btn" style="flex:1; color:var(--accent-main)" onclick="alert('Downloading 4K...')">DL</button>
                    </div>
                </div>`;
            });
            grid.innerHTML = html;
        } catch(e) { grid.innerHTML = "Search Error."; }
    },
    fill: (t) => {
        document.getElementById('rem-query').value = t;
        App.nav('remote');
    }
};

// --- REMOTE INJECTOR ---
const Remote = {
    send: async (isVideo) => {
        const t = document.getElementById('rem-target').value;
        const q = document.getElementById('rem-query').value;
        const log = document.getElementById('term-out');
        
        if(!t || !q) return alert("Missing Fields");
        
        log.innerHTML += `<div class="line"><span class="ts">[OUT]</span> Sending Payload...</div>`;
        
        try {
            const res = await fetch(App.api.play, { method:'POST', body:JSON.stringify({chat_id:t, query:q, video:isVideo}) });
            const d = await res.json();
            if(d.error) log.innerHTML += `<div class="line err"><span class="ts">[ERR]</span> ${d.error}</div>`;
            else log.innerHTML += `<div class="line suc"><span class="ts">[ACK]</span> Stream Active: ${d.title}</div>`;
        } catch(e) { log.innerHTML += `<div class="line err"><span class="ts">[NET]</span> Connection Failed.</div>`; }
    }
};

// --- QUEUE ---
const Queue = {
    fetch: async () => {
        const id = document.getElementById('queue-id').value;
        if(!id) return;
        
        const res = await fetch(`/api/queue/${id}`);
        const d = await res.json();
        const list = document.getElementById('queue-list');
        
        if(d.queue.length > 0) {
            let html = '';
            d.queue.forEach((t, i) => {
                html += `<div class="line"><span class="ts">[${i+1}]</span> ${t.title} <span style="opacity:0.5">(${t.duration})</span></div>`;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<div style="padding:20px; opacity:0.5">Queue Empty.</div>';
        }
    }
};

// --- CONTROL ---
const Control = {
    act: async (id, cmd) => {
        await fetch(App.api.control, { method:'POST', body:JSON.stringify({chat_id:id, action:cmd}) });
        App.poll();
    }
};

// Boot
window.onload = App.init;

</script>
</body>
</html>
