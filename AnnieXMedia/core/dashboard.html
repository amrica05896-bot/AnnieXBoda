<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Advanced System Core Interface for TitanOS">
<title>SYSTEM CORE • ENTERPRISE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    /* ==========================================================================
       1. THEME ENGINE & VARIABLES
       ========================================================================== */
    :root {
        /* ANIMATION TIMING */
        --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-in-out: cubic-bezier(0.645, 0.045, 0.355, 1);
        --duration-fast: 0.2s;
        --duration-norm: 0.4s;
        --duration-slow: 0.8s;

        /* DIMENSIONS */
        --sidebar-width: 280px;
        --header-height: 75px;
        --player-bar-height: 90px;
        --border-radius-sm: 8px;
        --border-radius-md: 14px;
        --border-radius-lg: 24px;
        --border-radius-xl: 32px;
    }

    /* --- DARK THEME (OBSIDIAN) --- */
    [data-theme="dark"] {
        --bg-root: #000000;
        --bg-glass: rgba(10, 10, 12, 0.75);
        --bg-glass-heavy: rgba(5, 5, 5, 0.9);
        --bg-panel: rgba(18, 18, 20, 0.6);
        --bg-surface: rgba(255, 255, 255, 0.03);
        --bg-input: rgba(0, 0, 0, 0.5);
        
        --border-dim: rgba(255, 255, 255, 0.06);
        --border-light: rgba(255, 255, 255, 0.12);
        
        --text-primary: #ffffff;
        --text-secondary: #9ca3af;
        --text-tertiary: #4b5563;
        
        --accent-primary: #3b82f6;
        --accent-glow: rgba(59, 130, 246, 0.4);
        --accent-secondary: #8b5cf6;
        --accent-success: #10b981;
        --accent-danger: #ef4444;
        --accent-warning: #f59e0b;
        
        --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.15);
        
        --backdrop-blur: blur(25px);
    }

    /* --- LIGHT THEME (FROST) --- */
    [data-theme="light"] {
        --bg-root: #e0e5ec;
        --bg-glass: rgba(255, 255, 255, 0.65);
        --bg-glass-heavy: rgba(255, 255, 255, 0.85);
        --bg-panel: rgba(255, 255, 255, 0.7);
        --bg-surface: rgba(255, 255, 255, 0.5);
        --bg-input: rgba(255, 255, 255, 0.9);
        
        --border-dim: rgba(0, 0, 0, 0.05);
        --border-light: rgba(0, 0, 0, 0.1);
        
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-tertiary: #9ca3af;
        
        --accent-primary: #2563eb;
        --accent-glow: rgba(37, 99, 235, 0.2);
        --accent-secondary: #7c3aed;
        --accent-success: #059669;
        --accent-danger: #dc2626;
        --accent-warning: #d97706;
        
        --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.1);
        --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.1);
        
        --backdrop-blur: blur(35px) saturate(180%);
    }

    /* ==========================================================================
       2. GLOBAL RESET
       ========================================================================== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-root);
        color: var(--text-primary);
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        transition: background-color var(--duration-norm) var(--ease-out), color var(--duration-norm) var(--ease-out);
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

    /* UTILITY CLASSES */
    .font-tech { font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .hidden { display: none !important; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .text-gradient {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       3. BACKGROUND LAYERS (PHYSICS & GRID)
       ========================================================================== */
    .background-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    
    .grid-overlay {
        position: absolute; inset: 0; opacity: 0.07;
        background-image: linear-gradient(var(--text-secondary) 1px, transparent 1px), linear-gradient(90deg, var(--text-secondary) 1px, transparent 1px);
        background-size: 50px 50px;
    }

    #liquid-canvas { width: 100%; height: 100%; }

    /* ==========================================================================
       4. APP SHELL LAYOUT
       ========================================================================== */
    .app-container {
        position: relative; z-index: 10; display: flex; width: 100%; height: 100%;
        backdrop-filter: blur(0px); /* Hardware acceleration hack */
    }

    /* --- SIDEBAR --- */
    .sidebar {
        width: var(--sidebar-width);
        height: 100%;
        background: var(--bg-glass);
        backdrop-filter: var(--backdrop-blur);
        border-right: 1px solid var(--border-dim);
        display: flex; flex-direction: column;
        padding: 30px 20px;
        transition: transform var(--duration-norm) var(--ease-out);
        z-index: 50;
    }

    .brand-container {
        display: flex; align-items: center; gap: 16px; margin-bottom: 50px; padding-left: 10px;
    }
    .brand-icon {
        width: 48px; height: 48px; border-radius: 14px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        display: flex; align-items: center; justify-content: center;
        font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 24px; color: #fff;
        box-shadow: 0 10px 25px var(--accent-glow);
    }
    .brand-info h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
    .brand-info span { font-size: 11px; color: var(--accent-primary); font-weight: 600; letter-spacing: 2px; }

    .nav-list { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
    
    .nav-item {
        display: flex; align-items: center; gap: 16px; padding: 14px 18px;
        border-radius: var(--border-radius-md); color: var(--text-secondary);
        font-size: 14px; font-weight: 600; cursor: pointer;
        transition: all 0.2s var(--ease-out); border: 1px solid transparent;
    }
    .nav-item svg { width: 22px; height: 22px; stroke-width: 2; transition: 0.2s; }
    .nav-item:hover { color: var(--text-primary); background: var(--bg-surface); }
    
    .nav-item.active {
        background: rgba(59, 130, 246, 0.1); 
        border-color: rgba(59, 130, 246, 0.2);
        color: var(--accent-primary);
        box-shadow: var(--shadow-sm);
    }
    .nav-item.active svg { stroke: var(--accent-primary); filter: drop-shadow(0 0 5px var(--accent-glow)); }

    .system-status-box {
        margin-top: 20px; padding: 20px; border-radius: var(--border-radius-lg);
        background: var(--bg-surface); border: 1px solid var(--border-dim);
    }
    .status-row { margin-bottom: 12px; }
    .status-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px; }
    .progress-track { width: 100%; height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.5s ease; }

    /* --- MAIN VIEWPORT --- */
    .viewport { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    .top-header {
        height: var(--header-height); display: flex; align-items: center; justify-content: space-between;
        padding: 0 40px; background: var(--bg-glass); backdrop-filter: var(--backdrop-blur);
        border-bottom: 1px solid var(--border-dim); z-index: 40;
    }

    .page-title h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .page-title .breadcrumb { font-size: 12px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }

    .header-actions { display: flex; align-items: center; gap: 20px; }

    .connection-badge {
        display: flex; align-items: center; gap: 8px; padding: 6px 14px;
        background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 30px; font-size: 12px; font-weight: 700; color: var(--accent-success);
        font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
    }
    .pulse-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

    .theme-toggle {
        width: 44px; height: 44px; border-radius: 12px; background: var(--bg-surface);
        border: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--text-secondary); transition: 0.3s;
    }
    .theme-toggle:hover { color: var(--accent-warning); border-color: var(--accent-warning); transform: rotate(15deg); }

    /* ==========================================================================
       5. VIEW CONTAINER & ANIMATIONS
       ========================================================================== */
    .content-stage {
        flex: 1; padding: 40px; overflow-y: auto; overflow-x: hidden;
        position: relative; scroll-behavior: smooth;
    }

    .view-section { display: none; width: 100%; height: 100%; animation: slideIn 0.5s var(--ease-out) forwards; }
    .view-section.active { display: block; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==========================================================================
       6. UI COMPONENTS (CARDS, BUTTONS, INPUTS)
       ========================================================================== */
    
    /* GRID SYSTEM */
    .grid-fluid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
    
    /* STREAM CARDS */
    .card-stream {
        background: var(--bg-panel); border: 1px solid var(--border-dim);
        border-radius: var(--border-radius-lg); padding: 24px;
        position: relative; overflow: hidden; transition: all 0.3s var(--ease-out);
        display: flex; flex-direction: column; gap: 20px;
    }
    .card-stream:hover {
        transform: translateY(-6px); border-color: var(--accent-primary);
        box-shadow: var(--shadow-md);
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .chat-id-tag {
        font-family: 'JetBrains Mono', monospace; font-size: 11px;
        background: var(--bg-surface); padding: 4px 8px; border-radius: 6px; color: var(--text-tertiary);
    }
    .live-tag {
        font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
        background: var(--accent-danger); color: #fff; padding: 4px 10px; border-radius: 4px;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }

    .media-info { display: flex; gap: 16px; align-items: center; }
    .media-cover {
        width: 72px; height: 72px; border-radius: 12px; background: #111;
        background-size: cover; background-position: center; border: 1px solid var(--border-dim);
        box-shadow: var(--shadow-sm); flex-shrink: 0;
    }
    .media-text { overflow: hidden; }
    .media-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; color: var(--text-primary); }
    .media-artist { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

    .control-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn-ctrl {
        height: 42px; display: flex; align-items: center; justify-content: center;
        background: var(--bg-surface); border: 1px solid var(--border-dim);
        border-radius: 10px; color: var(--text-primary); cursor: pointer; transition: 0.2s;
    }
    .btn-ctrl:hover { background: var(--text-primary); color: var(--bg-root); }
    .btn-ctrl.stop:hover { background: var(--accent-danger); color: #fff; border-color: var(--accent-danger); }
    
    .btn-cinema {
        width: 100%; height: 48px; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        border: none; border-radius: 12px; color: #fff; font-weight: 700; font-family: 'Rajdhani', sans-serif;
        font-size: 15px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
        position: relative; overflow: hidden; transition: 0.3s;
    }
    .btn-cinema:hover { box-shadow: var(--shadow-glow); transform: scale(1.02); }

    /* SEARCH & MEDIA LIST */
    .search-container {
        display: flex; gap: 15px; margin-bottom: 30px; position: sticky; top: 0;
        z-index: 20; background: var(--bg-root); padding-bottom: 10px;
    }
    .input-field {
        flex: 1; background: var(--bg-input); border: 1px solid var(--border-dim);
        padding: 18px 24px; border-radius: 16px; color: var(--text-primary);
        font-size: 16px; font-family: 'Inter', sans-serif; transition: 0.3s;
        backdrop-filter: blur(10px);
    }
    .input-field:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 4px var(--accent-glow); }
    
    .btn-search {
        padding: 0 32px; background: var(--text-primary); color: var(--bg-root);
        border: none; border-radius: 16px; font-weight: 800; cursor: pointer;
        font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-size: 16px;
    }

    .media-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    
    .media-item {
        background: var(--bg-panel); border: 1px solid var(--border-dim);
        border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
        transition: 0.2s;
    }
    .media-item:hover { border-color: var(--accent-primary); transform: translateY(-4px); }
    
    .thumb-wrapper {
        height: 160px; background: #111; position: relative; overflow: hidden;
    }
    .thumb-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .media-item:hover .thumb-img { transform: scale(1.1); }
    
    .duration-tag {
        position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.85);
        color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
    }
    
    .item-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .item-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .item-actions { display: flex; gap: 10px; margin-top: auto; }
    .btn-sm { flex: 1; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; }
    .btn-play-remote { background: rgba(59, 130, 246, 0.15); color: var(--accent-primary); border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-play-remote:hover { background: var(--accent-primary); color: #fff; }
    
    .btn-watch-local { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-dim); }
    .btn-watch-local:hover { background: var(--text-primary); color: var(--bg-root); }

    /* CONSOLE & QUEUE */
    .terminal-box {
        background: #0d0d0f; border: 1px solid var(--border-dim); border-radius: 20px;
        padding: 30px; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column;
        min-height: 500px;
    }
    .console-log { flex: 1; overflow-y: auto; color: #a0a0a0; font-size: 13px; margin-bottom: 20px; padding-right: 10px; }
    .log-line { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #1a1a1c; }
    .ts { color: #555; margin-right: 12px; }
    .log-s { color: var(--accent-success); } .log-e { color: var(--accent-danger); }
    
    .console-input-row { display: flex; gap: 15px; }
    .console-input {
        flex: 1; background: #1a1a1d; border: 1px solid #333; color: var(--accent-primary);
        padding: 14px; border-radius: 10px; font-family: inherit; font-size: 14px;
    }
    
    .queue-list-container {
        display: flex; flex-direction: column; gap: 10px;
    }
    .queue-entry {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--bg-surface); padding: 16px; border-radius: 12px;
        border: 1px solid var(--border-dim);
    }
    .q-meta { display: flex; align-items: center; gap: 15px; }
    .q-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; color: var(--text-tertiary); width: 30px; }
    .q-name { font-weight: 500; font-size: 14px; }
    .q-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary); background: var(--bg-input); padding: 4px 8px; border-radius: 4px; }

    /* ==========================================================================
       7. CINEMA MODE (NETFLIX-STYLE PLAYER)
       ========================================================================== */
    .cinema-overlay {
        position: fixed; inset: 0; background: #000; z-index: 2000;
        display: none; flex-direction: column; opacity: 0; transition: opacity 0.5s ease;
    }
    .cinema-overlay.active { display: flex; opacity: 1; }

    /* Top Bar */
    .cinema-top {
        position: absolute; top: 0; left: 0; width: 100%; height: 80px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
        z-index: 50; transition: transform 0.3s;
    }
    .cinema-logo { font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 4px; color: rgba(255,255,255,0.8); }
    .cinema-esc {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
        color: #fff; padding: 10px 24px; border-radius: 30px; cursor: pointer;
        font-weight: 700; font-size: 12px; font-family: 'Inter', sans-serif;
        backdrop-filter: blur(10px); transition: 0.3s; display: flex; align-items: center; gap: 10px;
    }
    .cinema-esc:hover { background: var(--accent-danger); border-color: var(--accent-danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

    /* Video Area */
    .cinema-viewport {
        flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
        background: #000; overflow: hidden;
    }
    .yt-embed-frame {
        width: 100%; height: 100%; border: none; pointer-events: none; /* Crucial for custom controls */
        position: absolute; z-index: 1; transform: scale(1.01);
    }
    .interact-mesh { position: absolute; inset: 0; z-index: 10; cursor: none; }
    .interact-mesh:hover { cursor: default; }

    /* Bottom Controls */
    .cinema-controls {
        position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 60px;
        background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        z-index: 50; opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; gap: 20px;
    }
    .cinema-viewport:hover .cinema-controls, .cinema-viewport:hover .cinema-top { opacity: 1; }

    .progress-bar-container {
        width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px;
        cursor: pointer; position: relative; transition: height 0.2s;
    }
    .progress-bar-container:hover { height: 10px; }
    .progress-val { height: 100%; background: var(--accent-primary); width: 0%; border-radius: 3px; position: relative; box-shadow: 0 0 15px var(--accent-primary); }
    .progress-head {
        width: 18px; height: 18px; background: #fff; border-radius: 50%;
        position: absolute; right: -9px; top: 50%; transform: translateY(-50%) scale(0);
        transition: transform 0.2s;
    }
    .progress-bar-container:hover .progress-head { transform: translateY(-50%) scale(1); }

    .ctrl-deck { display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .deck-left { display: flex; align-items: center; gap: 30px; }
    .deck-right { display: flex; align-items: center; gap: 20px; }

    .deck-btn { cursor: pointer; opacity: 0.8; transition: 0.2s; }
    .deck-btn:hover { opacity: 1; transform: scale(1.2); color: var(--accent-primary); }
    .deck-btn svg { width: 28px; height: 28px; fill: currentColor; }
    
    .play-pause-btn svg { width: 40px; height: 40px; }

    /* Loading Spinner */
    .loader-ring {
        position: absolute; width: 80px; height: 80px; z-index: 20;
        border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent-primary);
        border-radius: 50%; animation: spin 1s linear infinite; display: none;
    }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* ==========================================================================
       8. MOBILE NAVIGATION DOCK
       ========================================================================== */
    .mobile-dock {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 400px; height: 70px;
        background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(20px);
        border: 1px solid var(--border-light); border-radius: 40px;
        display: none; justify-content: space-around; align-items: center;
        z-index: 900; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .dock-item {
        color: var(--text-secondary); padding: 12px; border-radius: 50%;
        transition: 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .dock-item svg { width: 24px; height: 24px; fill: currentColor; }
    .dock-item.active {
        color: #fff; background: var(--accent-primary);
        box-shadow: 0 5px 20px var(--accent-glow); transform: translateY(-5px);
    }

    @media (max-width: 1024px) {
        .sidebar { display: none; }
        .mobile-dock { display: flex; }
        .top-header { padding: 0 20px; }
        .stage-content { padding: 20px; padding-bottom: 120px; }
        .grid-media { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
        .media-item { flex-direction: row; height: 110px; }
        .thumb-wrapper { width: 140px; height: 100%; flex-shrink: 0; }
        .console-form { grid-template-columns: 1fr; }
        .console-actions { flex-direction: column; }
    }

    /* TOAST NOTIFICATION */
    .sys-toast {
        position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: #111; border: 1px solid #333; padding: 14px 28px; border-radius: 50px;
        display: flex; align-items: center; gap: 12px; color: #fff; font-weight: 600;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
        transition: 0.4s var(--ease-out); z-index: 5000; font-size: 13px;
    }
    .sys-toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-icon { color: var(--accent-success); }

</style>
</head>
<body>

<canvas id="liquid-canvas" class="background-layer"></canvas>
<div class="grid-overlay background-layer"></div>

<div class="app-container">
    
    <aside class="sidebar">
        <div class="brand-container">
            <div class="brand-icon">S</div>
            <div class="brand-info">
                <h1>SYSTEM<br>CORE</h1>
                <span>V2.0 ULTIMATE</span>
            </div>
        </div>

        <nav class="nav-list">
            <div class="nav-item active" onclick="Navigation.go('dashboard', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Dashboard</span>
            </div>
            <div class="nav-item" onclick="Navigation.go('media', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                <span>Media Browser</span>
            </div>
            <div class="nav-item" onclick="Navigation.go('remote', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                <span>Remote Access</span>
            </div>
            <div class="nav-item" onclick="Navigation.go('queue', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span>Queue List</span>
            </div>
        </nav>

        <div class="system-status-box">
            <div class="status-row">
                <div class="status-header"><span>CPU LOAD</span><span id="cpu-text">0%</span></div>
                <div class="progress-track"><div class="progress-fill" id="cpu-bar" style="background:var(--accent-primary)"></div></div>
            </div>
            <div class="status-row" style="margin-bottom:0">
                <div class="status-header"><span>RAM USAGE</span><span id="ram-text">0GB</span></div>
                <div class="progress-track"><div class="progress-fill" id="ram-bar" style="background:var(--accent-secondary)"></div></div>
            </div>
        </div>
    </aside>

    <main class="viewport">
        <header class="top-header">
            <div class="page-title">
                <h2 id="page-heading">DASHBOARD</h2>
                <div class="breadcrumb">SYSTEM / OVERVIEW</div>
            </div>

            <div class="header-actions">
                <div class="connection-badge" id="conn-status">
                    <div class="pulse-dot"></div> CONNECTED
                </div>
                <div class="theme-toggle" onclick="App.toggleTheme()">
                    <svg viewBox="0 0 24 24" width="20" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
                </div>
            </div>
        </header>

        <div class="content-stage">
            
            <section id="view-dashboard" class="view-section active">
                <div class="grid-fluid" id="active-grid">
                    </div>
            </section>

            <section id="view-media" class="view-section">
                <div class="search-container">
                    <input type="text" class="input-field" id="search-input" placeholder="Search Global Database (YouTube)..." onkeypress="if(event.key==='Enter') Media.search()">
                    <button class="btn-search" onclick="Media.search()">SCAN</button>
                </div>
                <div class="media-list" id="media-results">
                    <div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-secondary); border:1px dashed var(--border-light); border-radius:20px;">
                        Waiting for input...
                    </div>
                </div>
            </section>

            <section id="view-remote" class="view-section">
                <div class="terminal-box" style="max-width:800px; margin:0 auto">
                    <h3 style="color:var(--accent-primary); margin-bottom:20px; border-bottom:1px solid var(--border-dim); padding-bottom:15px">REMOTE INJECTION PROTOCOL</h3>
                    
                    <div class="console-log" id="remote-log">
                        <div class="log-line"><span class="ts">[SYS]</span> Remote Protocol Initiated.</div>
                        <div class="log-line"><span class="ts">[NET]</span> Waiting for target...</div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:15px; margin-bottom:20px;">
                        <input type="text" class="console-input" id="remote-target" placeholder="TARGET CHAT ID (e.g., -100123456789)">
                        <input type="text" class="console-input" id="remote-payload" placeholder="PAYLOAD (Link or Song Name)">
                    </div>

                    <div style="display:flex; gap:15px;">
                        <button class="btn-sm" style="flex:2; background:var(--accent-primary); color:#fff; height:45px; font-size:13px" onclick="Remote.inject(false)">INJECT AUDIO STREAM</button>
                        <button class="btn-sm" style="flex:1; background:transparent; border:1px solid #fff; color:#fff; height:45px; font-size:13px" onclick="Remote.inject(true)">VIDEO FEED</button>
                    </div>
                </div>
            </section>

            <section id="view-queue" class="view-section">
                <div class="search-container">
                    <input type="text" class="input-field" id="queue-target" placeholder="Enter Chat ID to inspect queue...">
                    <button class="btn-search" onclick="Queue.fetch()">LOAD</button>
                </div>
                <div class="queue-list-container" id="queue-container">
                    </div>
            </section>

        </div>
    </main>
</div>

<div class="cinema-overlay" id="cinema-modal">
    <div class="cinema-top">
        <div class="cinema-logo">TITAN 4K</div>
        <div class="cinema-esc" onclick="Cinema.close()">
            <svg viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            ESCAPE
        </div>
    </div>

    <div class="cinema-viewport">
        <div class="loader-ring" id="video-loader"></div>
        <div class="interact-mesh" onclick="Cinema.togglePlay()"></div>
        
        <iframe id="yt-player-frame" class="yt-embed-frame" 
            allow="autoplay; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>

        <div class="cinema-controls">
            <div class="progress-bar-container">
                <div class="progress-val" style="width: 45%;"></div>
                <div class="progress-head"></div>
            </div>
            
            <div class="ctrl-deck">
                <div class="deck-left">
                    <div class="deck-btn play-pause-btn" onclick="Cinema.togglePlay()">
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </div>
                    <div class="deck-btn" onclick="Cinema.seek(-10)">
                        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                    </div>
                    <div class="deck-btn" onclick="Cinema.seek(10)">
                        <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                    </div>
                    <div style="font-weight:700; font-size:14px; letter-spacing:1px; margin-left:10px">LIVE FEED</div>
                </div>
                
                <div class="deck-right">
                    <div class="deck-btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></div>
                    <div class="deck-btn" onclick="Cinema.fullscreen()">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mobile-dock">
    <div class="dock-item active" onclick="Navigation.go('dashboard', this)">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
    </div>
    <div class="dock-item" onclick="Navigation.go('media', this)">
        <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
    </div>
    <div class="dock-item" onclick="Navigation.go('remote', this)">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H9v-2h6v2zm-3-5V7l6 3-6 3z"/></svg>
    </div>
    <div class="dock-item" onclick="Navigation.go('queue', this)">
        <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4z"/></svg>
    </div>
</div>

<div class="sys-toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" width="20" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    <span id="toast-msg">Operation Complete</span>
</div>

<script>
    // --- YOUTUBE API LOADER ---
    let ytPlayer;
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScript = document.getElementsByTagName('script')[0];
    firstScript.parentNode.insertBefore(tag, firstScript);

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player-frame', {
            height: '100%', width: '100%',
            playerVars: { 
                'controls': 0, 'modestbranding': 1, 'rel': 0, 'showinfo': 0, 
                'iv_load_policy': 3, 'disablekb': 1, 'fs': 0 
            },
            events: { 'onStateChange': onPlayerStateChange }
        });
    }

    let isVideoPlaying = false;
    function onPlayerStateChange(event) {
        const icon = document.getElementById('play-icon');
        const loader = document.getElementById('video-loader');
        
        if (event.data == YT.PlayerState.PLAYING) {
            isVideoPlaying = true;
            loader.style.display = 'none';
            icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else if (event.data == YT.PlayerState.PAUSED) {
            isVideoPlaying = false;
            icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        } else if (event.data == YT.PlayerState.BUFFERING) {
            loader.style.display = 'block';
        }
    }

    // --- CORE VARIABLES ---
    const API = {
        base: '',
        stats: '/api/stats',
        status: '/status_json',
        control: '/api/control',
        play: '/api/play',
        search: '/api/search',
        queue: '/api/queue'
    };

    // --- INITIALIZATION ---
    window.onload = () => {
        Physics.init();
        App.startHeartbeat();
    };

    const App = {
        theme: 'dark',
        
        toggleTheme: () => {
            App.theme = App.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', App.theme);
        },

        startHeartbeat: () => {
            setInterval(App.poll, 2500);
            App.poll();
        },

        poll: async () => {
            try {
                // Hardware Stats
                const statsRes = await fetch(API.stats);
                const stats = await statsRes.json();
                
                document.getElementById('cpu-bar').style.width = stats.cpu + '%';
                document.getElementById('cpu-text').innerText = stats.cpu + '%';
                document.getElementById('ram-bar').style.width = stats.ram_percent + '%';
                document.getElementById('ram-text').innerText = stats.ram_used_gb + 'GB';

                // Stream Status
                const statusRes = await fetch(API.status);
                const status = await statusRes.json();
                Dashboard.render(status);

                document.getElementById('conn-status').style.color = 'var(--accent-success)';
                document.getElementById('conn-status').style.borderColor = 'rgba(16, 185, 129, 0.2)';
            } catch(e) {
                document.getElementById('conn-status').style.color = 'var(--accent-danger)';
                document.getElementById('conn-status').style.borderColor = 'var(--accent-danger)';
            }
        }
    };

    // --- ROUTING ---
    const Navigation = {
        go: (viewId, btn) => {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            // Desktop Nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btn && btn.classList.contains('nav-item')) btn.classList.add('active');
            
            // Mobile Nav
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('active'));
            const mobIdx = ['dashboard', 'media', 'remote', 'queue'].indexOf(viewId);
            if(mobIdx > -1) document.querySelectorAll('.dock-item')[mobIdx].classList.add('active');

            const titles = {
                'dashboard': 'DASHBOARD', 'media': 'MEDIA BROWSER', 
                'remote': 'REMOTE ACCESS', 'queue': 'QUEUE LIST'
            };
            document.getElementById('page-heading').innerText = titles[viewId];
        }
    };

    // --- MODULE: DASHBOARD ---
    const Dashboard = {
        render: (data) => {
            const grid = document.getElementById('active-grid');
            if(data.count === 0) {
                if(!grid.innerHTML.includes('IDLE')) {
                    grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:100px; border:1px dashed var(--border-dim); border-radius:24px; color:var(--text-tertiary);">
                        <h2 style="font-size:32px; font-weight:700; margin-bottom:10px">SYSTEM IDLE</h2>
                        <p>No active streams detected in the network.</p>
                    </div>`;
                }
                return;
            }

            let html = '';
            data.chats.forEach(chat => {
                const thumb = chat.vidid ? `https://img.youtube.com/vi/${chat.vidid}/mqdefault.jpg` : '';
                html += `
                <div class="card-stream">
                    <div class="card-header">
                        <div class="chat-id-tag">${chat.chat_id}</div>
                        <div class="live-tag">LIVE</div>
                    </div>
                    <div class="media-info">
                        <div class="media-cover" style="background-image:url('${thumb}')"></div>
                        <div class="media-text">
                            <div class="media-title">${chat.title}</div>
                            <div class="media-artist">
                                <span>${chat.duration}</span> • <span style="color:var(--accent-primary); font-weight:700">${chat.stream_type}</span>
                            </div>
                        </div>
                    </div>
                    <div class="control-row">
                        <div class="btn-ctrl" onclick="Controller.send(${chat.chat_id}, 'pause')">
                            <svg viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </div>
                        <div class="btn-ctrl" onclick="Controller.send(${chat.chat_id}, 'resume')">
                            <svg viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="btn-ctrl" onclick="Controller.send(${chat.chat_id}, 'skip')">
                            <svg viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </div>
                    </div>
                    <div class="control-row" style="grid-template-columns:1fr">
                        <button class="btn-cinema" onclick="Cinema.open('${chat.vidid}')">ENTER CINEMA</button>
                    </div>
                </div>`;
            });
            
            if(grid.innerHTML.length !== html.length) grid.innerHTML = html;
        }
    };

    // --- MODULE: CONTROLLER ---
    const Controller = {
        send: async (id, act) => {
            UI.toast(`Sending command: ${act.toUpperCase()}`);
            await fetch(API.control, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: id, action: act})
            });
            App.poll();
        }
    };

    // --- MODULE: MEDIA BROWSER ---
    const Media = {
        search: async () => {
            const q = document.getElementById('search-input').value;
            const grid = document.getElementById('media-results');
            
            if(!q) return UI.toast("Enter a search query!");
            
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--accent-primary)">Scanning Neural Database...</div>`;
            
            try {
                const res = await fetch(API.search, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: q})
                });
                const data = await res.json();
                
                if(data.results && data.results.length > 0) {
                    let html = '';
                    data.results.forEach(item => {
                        html += `
                        <div class="media-item">
                            <div class="thumb-wrapper">
                                <img src="${item.thumb}" class="thumb-img">
                                <div class="duration-tag">${item.duration}</div>
                            </div>
                            <div class="item-body">
                                <div class="item-title">${item.title}</div>
                                <div class="item-actions">
                                    <button class="btn-sm btn-play-remote" onclick="Remote.fill('${item.title}')">REMOTE</button>
                                    <button class="btn-sm btn-watch-local" onclick="Cinema.open('${item.vidid}')">WATCH</button>
                                </div>
                            </div>
                        </div>`;
                    });
                    grid.innerHTML = html;
                } else {
                    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-secondary)">No results found.</div>`;
                }
            } catch(e) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--accent-danger)">Search Error.</div>`;
            }
        }
    };

    // --- MODULE: REMOTE INJECTOR ---
    const Remote = {
        fill: (title) => {
            document.getElementById('remote-payload').value = title;
            Navigation.go('remote', document.querySelectorAll('.nav-item')[2]);
        },
        inject: async (isVideo) => {
            const target = document.getElementById('remote-target').value;
            const query = document.getElementById('remote-payload').value;
            const log = document.getElementById('remote-log');
            
            if(!target || !query) return UI.toast("Missing Fields!");
            
            log.innerHTML += `<div class="log-line"><span class="ts">[OUT]</span> Sending Payload...</div>`;
            
            try {
                const res = await fetch(API.play, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: target, query: query, video: isVideo})
                });
                const d = await res.json();
                
                if(d.error) {
                    log.innerHTML += `<div class="log-line"><span class="ts">[ERR]</span> <span class="log-e">${d.error}</span></div>`;
                } else {
                    log.innerHTML += `<div class="log-line"><span class="ts">[ACK]</span> <span class="log-s">Success: ${d.title}</span></div>`;
                    UI.toast("Injection Successful");
                }
            } catch(e) {
                log.innerHTML += `<div class="log-line"><span class="ts">[ERR]</span> Network Failure.</div>`;
            }
        }
    };

    // --- MODULE: QUEUE ---
    const Queue = {
        fetch: async () => {
            const id = document.getElementById('queue-target').value;
            if(!id) return UI.toast("Enter Chat ID");
            
            const res = await fetch(`${API.queue}/${id}`);
            const data = await res.json();
            const list = document.getElementById('queue-container');
            
            if(data.queue && data.queue.length > 0) {
                let html = '';
                data.queue.forEach((item, index) => {
                    html += `
                    <div class="queue-entry">
                        <div class="q-meta">
                            <div class="q-num">${index+1}</div>
                            <div class="q-name">${item.title}</div>
                        </div>
                        <div class="q-time">${item.duration}</div>
                    </div>`;
                });
                list.innerHTML = html;
            } else {
                list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary)">Queue is empty.</div>`;
            }
        }
    };

    // --- MODULE: CINEMA ---
    const Cinema = {
        open: (vid) => {
            if(!vid) return UI.toast("No Video Source");
            const modal = document.getElementById('cinema-modal');
            const loader = document.getElementById('video-loader');
            
            if(ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(vid);
            }
            
            modal.classList.add('active');
            loader.style.display = 'block';
        },
        close: () => {
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
            document.getElementById('cinema-modal').classList.remove('active');
        },
        togglePlay: () => {
            if(!ytPlayer) return;
            if(ytPlayer.getPlayerState() == 1) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        },
        seek: (seconds) => {
            if(!ytPlayer) return;
            ytPlayer.seekTo(ytPlayer.getCurrentTime() + seconds, true);
        },
        fullscreen: () => {
            const elem = document.getElementById('cinema-modal');
            if (!document.fullscreenElement) {
                elem.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    };

    // --- PHYSICS BACKGROUND ---
    const Physics = {
        init: () => {
            const canvas = document.getElementById('liquid-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, orbs = [];
            
            const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize);
            resize();

            // Create Orbs
            for(let i=0; i<6; i++) {
                orbs.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 200 + 100,
                    color: `hsla(${200 + (i*30)}, 70%, 50%, 0.1)`
                });
            }

            const loop = () => {
                ctx.clearRect(0, 0, width, height);
                orbs.forEach(o => {
                    o.x += o.vx; o.y += o.vy;
                    if(o.x < -o.r || o.x > width + o.r) o.vx *= -1;
                    if(o.y < -o.r || o.y > height + o.r) o.vy *= -1;
                    
                    const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
                    grad.addColorStop(0, o.color);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
                    ctx.fill();
                });
                requestAnimationFrame(loop);
            };
            loop();
        }
    };

    // --- UI UTILS ---
    const UI = {
        toast: (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        }
    };

</script>
</body>
